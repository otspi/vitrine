name: Déploiement Infomaniak (SFTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déploiement SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_SERVER_DIR: ${{ vars.SFTP_SERVER_DIR }}
        run: |
          test -n "$SFTP_SERVER_DIR" || { echo "Variable SFTP_SERVER_DIR non définie"; exit 1; }
          # Vérification stricte de la clé d'hôte du serveur
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          lftp -u "$SFTP_USERNAME" --env-password -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm no;
            set net:max-retries 2;
            mirror --reverse --verbose --no-perms --exclude-glob .git* --exclude-glob .github/ --exclude-glob README.md --exclude-glob LICENSE ./ '$SFTP_SERVER_DIR';
            bye"
