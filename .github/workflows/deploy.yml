name: Déploiement o2switch (FTPS)

# www.otspi.org (et les domaines redirigés) est servi par o2switch depuis le 26 septembre 2026.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Compte FTP dédié, cantonné au répertoire du site ; TLS obligatoire et certificat vérifié.
      - name: Déploiement FTPS
        env:
          FTP_HOST: ${{ vars.O2_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.O2_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.O2_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ftp:passive-mode yes;
            set net:max-retries 2;
            mirror --reverse --verbose --no-perms --exclude '^\\.git(/|$)' --exclude '^\\.github/' --exclude '^\\.gitignore$' --exclude '^README\\.md$' --exclude '^LICENSE$' --exclude '^scripts/' ./ ./;
            bye"
