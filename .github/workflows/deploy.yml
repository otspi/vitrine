name: Déploiement o2switch (FTPS)

# www.otspi.org (et les domaines redirigés) est servi par o2switch depuis le 26 septembre 2026.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai : lister les transferts et suppressions sans rien modifier"
        type: boolean
        default: false

concurrency:
  group: "deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Une page au menu divergent ou appelant une ancienne version du CSS n'est pas publiée.
      - name: Contrôle des pages
        run: python3 scripts/verifier_site.py

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Compte FTP dédié, cantonné au répertoire du site ; TLS obligatoire et certificat vérifié.
      # --delete retire du serveur les fichiers supprimés du dépôt. Les chemins exclus ne sont
      # ni envoyés ni supprimés : on y protège aussi ce que l'hébergeur dépose lui-même
      # (validation des certificats, cgi-bin, réglages PHP, journal d'erreurs).
      - name: Déploiement FTPS
        env:
          FTP_HOST: ${{ vars.O2_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.O2_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.O2_FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_HOST" -e "
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate yes;
            set ftp:passive-mode yes;
            set net:max-retries 2;
            mirror --reverse --delete $DRY_RUN --verbose --no-perms \
              --exclude '^\\.git(/|$)' --exclude '^\\.github/' --exclude '^\\.gitignore$' \
              --exclude '^README\\.md$' --exclude '^LICENSE$' --exclude '^scripts/' \
              --exclude '^\\.well-known/(acme-challenge|pki-validation)/' --exclude '^cgi-bin/' \
              --exclude '^\\.user\\.ini$' --exclude '^\\.ftpquota$' --exclude '(^|/)error_log$' \
              ./ ./;
            bye"
