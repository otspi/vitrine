name: Déploiement Infomaniak (FTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # L'hébergement n'expose que le FTP sans TLS : le compte utilisé est
      # cantonné au seul répertoire du site www.otspi.org.
      - name: Déploiement FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_HOST" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            set net:max-retries 2;
            mirror --reverse --verbose --no-perms --exclude-glob .git* --exclude-glob .github/ --exclude-glob README.md --exclude-glob LICENSE ./ '$FTP_SERVER_DIR';
            bye"
